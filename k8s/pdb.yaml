# Keep at least 2 of each API's replicas serving through voluntary disruptions: node drains for
# GKE upgrades, cluster-autoscaler scale-downs and zone rebalancing. With the HPA floor of 3
# (k8s/hpa.yaml, k8s/issue-service-hpa.yaml) one pod can be evicted at a time, so drains never
# stall. Involuntary loss (a zone outage) isn't governed by a PDB; the zone topology spread in the
# Deployments covers that.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-service
  labels:
    app: message-service
spec:
  minAvailable: 2
  # Evict pods that never became Ready (e.g. stuck on a DB wait) even when the budget is
  # exhausted, so a broken rollout can't wedge a node drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: message-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: issue-service
  labels:
    app: issue-service
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: issue-service
