apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-service
  labels:
    app: issue-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: issue-service
  template:
    metadata:
      labels:
        app: issue-service
    spec:
      securityContext:
        # runAsUser is set explicitly, not just runAsNonRoot: the image's `USER node` is a name,
        # not a number, so the kubelet can't verify it's non-root on its own. 1000 is node's uid.
        # The container-level securityContexts below (no privilege escalation, no capabilities)
        # are what the Kyverno policies in k8s/policies/ require.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: issue-service-config
            - secretRef:
                name: issue-service-db-credentials
          env:
            # Cloud SQL private IP, from the Secret Crossplane writes for the PostgresInstance
            # (k8s/postgres.yaml). Until that exists the pod shows CreateContainerConfigError
            # and the kubelet keeps retrying.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
          command:
            - sh
            - -c
            - |
              # Log in to the service's own database as its own user, not just pg_isready: Cloud
              # SQL accepts connections minutes before Crossplane has created the database and
              # user, and `prisma migrate deploy` at startup would crash on them missing.
              export PGPASSWORD="$DB_PASSWORD" PGSSLMODE="$DB_SSLMODE" PGCONNECT_TIMEOUT=3
              until psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for database $DB_NAME on Cloud SQL at $DB_HOST:$DB_PORT..."
                sleep 2
              done
      containers:
        - name: issue-service
          image: issue-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: issue-service-config
            - secretRef:
                name: issue-service-db-credentials
          env:
            # Cloud SQL private IP, see the wait-for-postgres init container.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Shutdown: the pod leaves the Service endpoints as soon as it is Terminating, but the
          # Gateway's load balancer takes a few seconds to notice. Keep serving through that window,
          # then SIGTERM runs the app's graceful shutdown (issue-service/src/index.ts).
          # 10s + shutdown < 30s.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      # Spread replicas: hostname spread handles single-node loss; zone spread puts the 3 replicas
      # in us-central1-a/b/c (the node pool spans all three, gke-deploy.sh NODE_ZONES), so losing
      # a zone leaves two serving. ScheduleAnyway, not DoNotSchedule: during a zone outage the dead
      # zone's NotReady nodes still count as a domain, and a hard constraint would block the
      # replacement pod from the surviving zones. Voluntary disruptions: k8s/pdb.yaml.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: issue-service
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: issue-service
