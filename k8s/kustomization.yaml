apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - resourcequota.yaml
  - networkpolicies.yaml
  - external-secret.yaml
  - configmap.yaml
  - postgres.yaml
  - hazelcast-jmx-exporter-configmap.yaml
  - hazelcast-deployment.yaml
  - hazelcast-service.yaml
  - deployment.yaml
  - hpa.yaml
  - service.yaml
  - issue-service-deployment.yaml
  - issue-service-hpa.yaml
  - issue-service-service.yaml
  - pdb.yaml
  - gateway.yaml

images:
  - name: message-service
    newName: us-central1-docker.pkg.dev/k8s-dev-412419/graphql-apollo-prisma-o2/message-service
    newTag: latest
  - name: issue-service
    newName: us-central1-docker.pkg.dev/k8s-dev-412419/graphql-apollo-prisma-o2/issue-service
    newTag: latest
