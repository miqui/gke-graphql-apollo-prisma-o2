# Database credentials, one Secret per service, built by External Secrets from GCP Secret Manager
# (seeded from 1Password by gke-secrets-seed.sh). Each is read by its service's containers and,
# via the PostgresInstance's per-database passwordSecretRef (k8s/postgres.yaml), by Crossplane -
# which sets that Cloud SQL user's password from it - so an app and its database user can't drift
# apart.
#
# User names aren't secret, so they're templated in here rather than stored; each must match the
# userName of its database in postgres.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: message-service-db-credentials
  labels:
    app: message-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: message-service-db-credentials
    creationPolicy: Owner
    template:
      data:
        DB_USER: message_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: gql-postgres-message-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issue-service-db-credentials
  labels:
    app: issue-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: issue-service-db-credentials
    creationPolicy: Owner
    template:
      data:
        DB_USER: issue_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: gql-postgres-issue-password
