# The official postgres image only auto-creates one database (via POSTGRES_DB,
# see k8s/postgres-config in configmap.yaml) on first init. This mounts a second
# init script into /docker-entrypoint-initdb.d so issue-service gets its own
# "issuedb" database on the same Postgres instance, owned by the same bootstrap
# user (POSTGRES_USER/DB_USER - see k8s/secret.yaml) that already owns messagedb.
#
# Like the rest of this disposable local cluster, this only runs against a fresh
# PGDATA - postgres skips /docker-entrypoint-initdb.d entirely once the data
# directory has been initialized once (see postgres-statefulset.yaml's PVC).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  01-create-issuedb.sql: |
    CREATE DATABASE issuedb;
