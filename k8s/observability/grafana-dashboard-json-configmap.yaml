apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: observability
  labels:
    app: grafana
data:
  openobserve-ops.json: |
    {
      "title": "OpenObserve Ops",
      "uid": "openobserve-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "OpenObserve Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"openobserve\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Disk Usage",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              }
            }
          },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"} / zo_node_disk_total{job=\"openobserve\"} * 100", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Process Memory (RSS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Open File Descriptors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "process_open_fds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "time() - process_start_time_seconds{job=\"openobserve\"}", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Ingest Rate (records/s)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Request Rate by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_http_incoming_requests{job=\"openobserve\"}[5m])) by (endpoint, status)", "legendFormat": "{{endpoint}} ({{status}})", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "title": "HTTP Response Time p95/p99 by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p95 {{endpoint}}", "refId": "A" },
            { "expr": "histogram_quantile(0.99, sum(rate(zo_http_response_time_bucket{job=\"openobserve\"}[5m])) by (le, endpoint))", "legendFormat": "p99 {{endpoint}}", "refId": "B" }
          ]
        },
        {
          "id": 9,
          "title": "Ingest Rate by Stream Type (records/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_records{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Ingest Rate by Stream Type (bytes/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            { "expr": "sum(rate(zo_ingest_bytes{job=\"openobserve\"}[5m])) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 11,
          "title": "In-Memory MemTable Size",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "description": "Watch this against OpenObserve's memory limit (see k8s/observability/openobserve-values.yaml resources.limits.memory) - this is what overflowed (HTTP 400 MemoryTableOverflowError) before remote_write was scoped down / OpenObserve's resources were bumped.",
          "targets": [
            { "expr": "zo_ingest_memtable_bytes{job=\"openobserve\"}", "legendFormat": "memtable", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "WAL Used Bytes by Stream Type",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum(zo_ingest_wal_used_bytes{job=\"openobserve\"}) by (stream_type)", "legendFormat": "{{stream_type}}", "refId": "A" }
          ]
        },
        {
          "id": 13,
          "title": "Process CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            { "expr": "rate(process_cpu_seconds_total{job=\"openobserve\"}[5m]) * 100", "legendFormat": "cpu", "refId": "A" }
          ]
        },
        {
          "id": 14,
          "title": "Disk Usage vs Total",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "zo_node_disk_usage{job=\"openobserve\"}", "legendFormat": "used", "refId": "A" },
            { "expr": "zo_node_disk_total{job=\"openobserve\"}", "legendFormat": "total", "refId": "B" }
          ]
        }
      ]
    }
  graphql-api.json: |
    {
      "title": "graphql-api",
      "uid": "graphql-api",
      "description": "Per-API GraphQL/Prisma/Node.js metrics. Use the Service dropdown to pick message-service, issue-service, or both - every series is filtered on service_name.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "query": "message-service,issue-service",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "options": [
              { "selected": true, "text": "All", "value": "$__all" },
              { "selected": false, "text": "message-service", "value": "message-service" },
              { "selected": false, "text": "issue-service", "value": "issue-service" }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Ready Pods",
          "description": "Pods passing readiness for the selected service(s). Replaces the old 'Service Up' panel, which only reflected whether the OTel Collector was being scraped.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_ready{condition=\"true\",namespace=\"default\",pod=~\"$service-.*\"}) or vector(0)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Prisma Pool Connections (open/busy/idle)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(prisma_pool_connections_open{service_name=~\"$service\"})", "legendFormat": "open", "refId": "A" },
            { "expr": "sum(prisma_pool_connections_busy{service_name=~\"$service\"})", "legendFormat": "busy", "refId": "B" },
            { "expr": "sum(prisma_pool_connections_idle{service_name=~\"$service\"})", "legendFormat": "idle", "refId": "C" }
          ]
        },
        {
          "id": 3,
          "title": "Process CPU Usage (hottest pod)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            { "expr": "max(nodejs_process_cpu_usage_ratio{service_name=~\"$service\"})", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Event Loop Lag (p99, worst pod)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "max(nodejs_eventloop_lag_p99_ms{service_name=~\"$service\"})", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "GraphQL Request Rate by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\"}[1m])) by (service_name, root_field)",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "GraphQL Average Request Latency by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "sum(rate(graphql_request_duration_ms_sum{service_name=~\"$service\"}[1m])) by (service_name, root_field) / sum(rate(graphql_request_duration_ms_count{service_name=~\"$service\"}[1m])) by (service_name, root_field)",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Process Memory (RSS / Heap Used) by Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "nodejs_process_memory_rss_bytes{service_name=~\"$service\"}", "legendFormat": "rss {{k8s_pod_name}}", "refId": "A" },
            { "expr": "nodejs_process_memory_heap_used_bytes{service_name=~\"$service\"}", "legendFormat": "heap used {{k8s_pod_name}}", "refId": "B" }
          ]
        },
        {
          "id": 8,
          "title": "GraphQL Error Rate by Root Field",
          "description": "graphql_errors_total is only created on the first error, so this panel is empty (not zero) until an operation returns errors.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\"}[5m])) by (service_name, root_field)",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  kind-cluster-ops.json: |
    {
      "title": "kind cluster ops",
      "uid": "kind-cluster-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Nodes Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Pending / Failed / Unknown Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Node CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Node Disk Usage (/var)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
          "targets": [
            {
              "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/var\"} / node_filesystem_size_bytes{mountpoint=\"/var\"})) * 100",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pods by Phase",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase) by (phase)",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Container CPU Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\",container!=\"\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Container Memory Usage by Namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace!=\"\",container!=\"\"}) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Pod Restarts by Pod (15m increase)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  postgres-ops.json: |
    {
      "title": "PostgreSQL Ops & Queries",
      "uid": "postgres-ops",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "PostgreSQL Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_up", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Active Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_stat_activity_count)", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Buffer Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            {
              "expr": "sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Deadlocks (1h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(pg_stat_database_deadlocks[1h]))", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Transaction Rate (commit vs rollback)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_xact_commit[5m])) by (datname)", "legendFormat": "commit {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_xact_rollback[5m])) by (datname)", "legendFormat": "rollback {{datname}}", "refId": "B" }
          ]
        },
        {
          "id": 6,
          "title": "Tuple Write Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_tup_inserted[5m])) by (datname)", "legendFormat": "inserted {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_tup_updated[5m])) by (datname)", "legendFormat": "updated {{datname}}", "refId": "B" },
            { "expr": "sum(rate(pg_stat_database_tup_deleted[5m])) by (datname)", "legendFormat": "deleted {{datname}}", "refId": "C" }
          ]
        },
        {
          "id": 7,
          "title": "Buffer Cache I/O Rate (hit vs disk read)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_blks_hit[5m])) by (datname)", "legendFormat": "hit {{datname}}", "refId": "A" },
            { "expr": "sum(rate(pg_stat_database_blks_read[5m])) by (datname)", "legendFormat": "disk read {{datname}}", "refId": "B" }
          ]
        },
        {
          "id": 8,
          "title": "Locks by Mode",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_locks_count) by (mode)", "legendFormat": "{{mode}}", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "Connections by State",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_stat_activity_count) by (state)", "legendFormat": "{{state}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Checkpoint Rate (scheduled vs requested)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(pg_stat_bgwriter_checkpoints_timed_total[5m])", "legendFormat": "scheduled", "refId": "A" },
            { "expr": "rate(pg_stat_bgwriter_checkpoints_req_total[5m])", "legendFormat": "requested", "refId": "B" }
          ]
        },
        {
          "id": 11,
          "title": "Top Queries by Execution Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "topk(10, sum(rate(pg_stat_statements_calls_total[5m])) by (queryid, datname))",
              "legendFormat": "{{queryid}} ({{datname}})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "Top Queries by Mean Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "topk(10, sum(rate(pg_stat_statements_seconds_total[5m])) by (queryid) / sum(rate(pg_stat_statements_calls_total[5m])) by (queryid))",
              "legendFormat": "{{queryid}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "Query ID -> SQL Text",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "pg_stat_statements_query_id",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
  hazelcast-cache.json: |
    {
      "title": "Hazelcast Cache",
      "uid": "hazelcast-cache",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Cluster Size (members)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_size{prefix=\"cluster\"}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Connected Clients",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_count{prefix=\"client.endpoint\"}", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "\"messages\" Map Cache Hit Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            {
              "expr": "com_hazelcast_metrics_hits{tag0=~\".*name=messages.*\"} / com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "\"messages\" Map Cached Entries",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_ownedentrycount{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "\"messages\" Map Operation Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_hits{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "hits", "refId": "A" },
            { "expr": "rate(com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "gets", "refId": "B" },
            { "expr": "rate(com_hazelcast_metrics_putcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "puts", "refId": "C" },
            { "expr": "rate(com_hazelcast_metrics_removecount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "removes", "refId": "D" }
          ]
        },
        {
          "id": 6,
          "title": "\"messages\" Map Average Latency (get vs put)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "rate(com_hazelcast_metrics_totalgetlatency{tag0=~\".*name=messages.*\"}[5m]) / rate(com_hazelcast_metrics_getcount{tag0=~\".*name=messages.*\"}[5m])",
              "legendFormat": "get",
              "refId": "A"
            },
            {
              "expr": "rate(com_hazelcast_metrics_totalputlatency{tag0=~\".*name=messages.*\"}[5m]) / rate(com_hazelcast_metrics_putcount{tag0=~\".*name=messages.*\"}[5m])",
              "legendFormat": "put",
              "refId": "B"
            }
          ]
        },
        {
          "id": 7,
          "title": "Member Heap Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "com_hazelcast_metrics_usedheap{prefix=\"memory\"}", "legendFormat": "used", "refId": "A" },
            { "expr": "com_hazelcast_metrics_committedheap{prefix=\"memory\"}", "legendFormat": "committed", "refId": "B" },
            { "expr": "com_hazelcast_metrics_maxheap{prefix=\"memory\"}", "legendFormat": "max", "refId": "C" }
          ]
        },
        {
          "id": 8,
          "title": "GC Minor Collection Time (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_minortime{prefix=\"gc\"}[5m])", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "TCP Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_activecount{prefix=\"tcp.connection\"}", "legendFormat": "active", "refId": "A" },
            { "expr": "com_hazelcast_metrics_clientcount{prefix=\"tcp.connection\"}", "legendFormat": "client", "refId": "B" }
          ]
        },
        {
          "id": 10,
          "title": "\"messages\" Map Evictions & Expirations Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "rate(com_hazelcast_metrics_evictioncount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "evictions", "refId": "A" },
            { "expr": "rate(com_hazelcast_metrics_expirationcount{tag0=~\".*name=messages.*\"}[5m])", "legendFormat": "expirations", "refId": "B" }
          ]
        },
        {
          "id": 11,
          "title": "\"messages\" Map Owned Entry Memory Cost",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "com_hazelcast_metrics_ownedentrymemorycost{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "\"messages\" Map Backup Entry Count",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "com_hazelcast_metrics_backupentrycount{tag0=~\".*name=messages.*\"}", "refId": "A" }
          ]
        }
      ]
    }
  api-red.json: |
    {
      "title": "API RED & Saturation",
      "uid": "api-red",
      "description": "RED metrics plus DB-pool and container saturation. Use the Service dropdown to pick message-service, issue-service, or both - GraphQL/Prisma series filter on service_name, container/pod series on the container name (which matches the service name).",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "custom",
            "query": "message-service,issue-service",
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "options": [
              { "selected": true, "text": "All", "value": "$__all" },
              { "selected": false, "text": "message-service", "value": "message-service" },
              { "selected": false, "text": "issue-service", "value": "issue-service" }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (RPS)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "p99 Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Ratio",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(graphql_errors_total{service_name=~\"$service\"}[5m])) or vector(0)) / sum(rate(graphql_requests_total{service_name=~\"$service\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Prisma Pool Busy Connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(prisma_pool_connections_busy{service_name=~\"$service\"})", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Request Rate by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\"}[5m])) by (service_name, root_field)",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Latency Percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le))", "legendFormat": "p90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le))", "legendFormat": "p95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le))", "legendFormat": "p99", "refId": "D" }
          ]
        },
        {
          "id": 7,
          "title": "Error Rate by Root Field",
          "description": "graphql_errors_total is only created on the first error, so this panel is empty (not zero) until an operation returns errors.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\"}[5m])) by (service_name, root_field)",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Request Rate vs Error Rate (overall)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\"}[5m]))", "legendFormat": "requests", "refId": "A" },
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\"}[5m])) or vector(0)", "legendFormat": "errors", "refId": "B" }
          ]
        },
        {
          "id": 9,
          "title": "Latency by Root Field (p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\"}[5m])) by (le, service_name, root_field))",
              "legendFormat": "{{service_name}} / {{root_field}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "DB Connection Pool Utilization (Prisma)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(prisma_pool_connections_busy{service_name=~\"$service\"}) by (service_name)", "legendFormat": "busy {{service_name}}", "refId": "A" },
            { "expr": "sum(prisma_pool_connections_idle{service_name=~\"$service\"}) by (service_name)", "legendFormat": "idle {{service_name}}", "refId": "B" },
            { "expr": "sum(prisma_pool_connections_open{service_name=~\"$service\"}) by (service_name)", "legendFormat": "open (capacity) {{service_name}}", "refId": "C" }
          ]
        },
        {
          "id": 11,
          "title": "DB Query / Pool Wait Time (avg)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "avg(prisma_client_queries_duration_avg_ms{service_name=~\"$service\"}) by (service_name)", "legendFormat": "query duration (avg) {{service_name}}", "refId": "A" },
            { "expr": "avg(prisma_client_queries_wait_avg_ms{service_name=~\"$service\"}) by (service_name)", "legendFormat": "pool wait (avg) {{service_name}}", "refId": "B" }
          ]
        },
        {
          "id": 12,
          "title": "CPU Throttling Ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{container=~\"$service\"}[5m])) by (pod) / sum(rate(container_cpu_cfs_periods_total{container=~\"$service\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "title": "Container Memory vs Limit",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{container=~\"$service\"}) by (pod)", "legendFormat": "{{pod}}", "refId": "A" },
            { "expr": "max(container_spec_memory_limit_bytes{container=~\"$service\"}) by (container)", "legendFormat": "limit {{container}}", "refId": "B" }
          ]
        },
        {
          "id": 14,
          "title": "Pod Health (restarts & readiness)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(increase(kube_pod_container_status_restarts_total{container=~\"$service\"}[15m]))", "legendFormat": "restarts (15m)", "refId": "A" },
            { "expr": "sum(kube_pod_status_ready{condition=\"true\",namespace=\"default\",pod=~\"$service-.*\"})", "legendFormat": "ready pods", "refId": "B" }
          ]
        }
      ]
    }
  graphql-operations.json: |
    {
      "title": "GraphQL Operations",
      "uid": "graphql-operations",
      "description": "Traffic and latency per schema operation: operation type (query/mutation) and root field (e.g. messages, createMessage, moveIssue) - bounded by the schema, unlike client-supplied operation names. Requests that fail parse/validation appear as operation_type/root_field 'unresolved'. A multi-root-field operation counts once per root field.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          { "name": "service", "label": "Service", "type": "custom", "query": "message-service,issue-service", "multi": true, "includeAll": true, "current": { "selected": true, "text": ["All"], "value": ["$__all"] }, "options": [{ "selected": true, "text": "All", "value": "$__all" }, { "selected": false, "text": "message-service", "value": "message-service" }, { "selected": false, "text": "issue-service", "value": "issue-service" }] },
          { "name": "operation_type", "label": "Operation type", "type": "custom", "query": "query,mutation,unresolved", "multi": true, "includeAll": true, "current": { "selected": true, "text": ["All"], "value": ["$__all"] }, "options": [{ "selected": true, "text": "All", "value": "$__all" }, { "selected": false, "text": "query", "value": "query" }, { "selected": false, "text": "mutation", "value": "mutation" }, { "selected": false, "text": "unresolved", "value": "unresolved" }] },
          { "name": "root_field", "label": "Root field", "type": "query", "datasource": { "type": "prometheus", "uid": "prometheus" }, "query": { "query": "label_values(graphql_requests_total{service_name=~\"$service\"}, root_field)", "refId": "PrometheusVariableQueryEditor-VariableQuery" }, "definition": "label_values(graphql_requests_total{service_name=~\"$service\"}, root_field)", "refresh": 2, "sort": 1, "multi": true, "includeAll": true, "allValue": ".*", "current": { "selected": true, "text": ["All"], "value": ["$__all"] } }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Root-field Requests/s",
          "description": "Total request rate for the selected services, operation types and root fields. Counted once per root field of each operation, so a request selecting two root fields appears under both.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Mutation Share",
          "description": "Share of requests that are mutations (writes).",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\",operation_type=\"mutation\"}[5m])) / sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "p95 Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (le))", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "p99 Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (le))", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Error Ratio",
          "description": "Errors / requests. Includes client-caused errors (NOT_FOUND, BAD_USER_INPUT, CONFLICT); see the GraphQL Errors dashboard for the breakdown by code.",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 }] } } },
          "targets": [
            { "expr": "(sum(rate(graphql_errors_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) or vector(0)) / sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Active Root Fields",
          "description": "Number of distinct root fields that received traffic in the last 5 minutes.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(sum by (root_field) (rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) > 0) or vector(0)", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "Request Rate by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (service_name, root_field)", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "title": "Query vs Mutation Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (service_name, operation_type)", "legendFormat": "{{service_name}} / {{operation_type}}", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "p95 Latency by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (le, service_name, root_field))", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "Average Latency by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" } },
          "targets": [
            { "expr": "sum(rate(graphql_request_duration_ms_sum{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (service_name, root_field) / sum(rate(graphql_request_duration_ms_count{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[5m])) by (service_name, root_field)", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 11,
          "title": "Latency Distribution",
          "description": "Where request durations land across the histogram buckets (5 ms to 10 s) for the current selection. A second hump usually means a slow path (cache miss, N+1) mixed into fast traffic.",
          "type": "heatmap",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": { "calculate": false, "yAxis": { "unit": "ms" }, "cellGap": 1, "color": { "scheme": "Spectral", "mode": "scheme" } },
          "targets": [
            { "expr": "sum(increase(graphql_request_duration_ms_bucket{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__rate_interval])) by (le)", "legendFormat": "{{le}}", "format": "heatmap", "refId": "A" }
          ]
        },
        {
          "id": 12,
          "title": "Root Field Summary (current window)",
          "description": "One row per (service, root field) over the selected time range: request rate, p95 latency and error ratio.",
          "type": "table",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "overrides": [{ "matcher": { "id": "byName", "options": "req/s" }, "properties": [{ "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 }] }, { "matcher": { "id": "byName", "options": "p95 (ms)" }, "properties": [{ "id": "unit", "value": "ms" }, { "id": "decimals", "value": 1 }] }, { "matcher": { "id": "byName", "options": "error ratio" }, "properties": [{ "id": "unit", "value": "percentunit" }, { "id": "decimals", "value": 2 }] }] },
          "transformations": [{ "id": "joinByField", "options": { "byField": "root_field", "mode": "outer" } }, { "id": "organize", "options": { "excludeByName": { "Time": true, "Time 1": true, "Time 2": true, "Time 3": true, "service_name 1": true, "service_name 2": true }, "renameByName": { "Value #A": "req/s", "Value #B": "p95 (ms)", "Value #C": "error ratio", "service_name 3": "service", "service_name": "service", "root_field": "root field" } } }, { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "req/s", "desc": true }] } }],
          "targets": [
            { "expr": "sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__range])) by (service_name, root_field)", "format": "table", "instant": true, "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(graphql_request_duration_ms_bucket{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__range])) by (le, service_name, root_field))", "format": "table", "instant": true, "refId": "B" },
            { "expr": "(sum(rate(graphql_errors_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__range])) by (service_name, root_field) or (sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__range])) by (service_name, root_field) * 0)) / sum(rate(graphql_requests_total{service_name=~\"$service\",operation_type=~\"$operation_type\",root_field=~\"$root_field\"}[$__range])) by (service_name, root_field)", "format": "table", "instant": true, "refId": "C" }
          ]
        }
      ]
    }
  graphql-errors.json: |
    {
      "title": "GraphQL Errors",
      "uid": "graphql-errors",
      "description": "GraphQL errors ride in HTTP 200 responses, so they never show up as HTTP 5xx. This breaks them down by extensions.code (NOT_FOUND, CONFLICT, BAD_USER_INPUT, GRAPHQL_VALIDATION_FAILED, GRAPHQL_PARSE_FAILED, INTERNAL_SERVER_ERROR) and by the root field that failed. Panels are empty, not zero, until an error has occurred: the counter is only created on the first error.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          { "name": "service", "label": "Service", "type": "custom", "query": "message-service,issue-service", "multi": true, "includeAll": true, "current": { "selected": true, "text": ["All"], "value": ["$__all"] }, "options": [{ "selected": true, "text": "All", "value": "$__all" }, { "selected": false, "text": "message-service", "value": "message-service" }, { "selected": false, "text": "issue-service", "value": "issue-service" }] },
          { "name": "root_field", "label": "Root field", "type": "query", "datasource": { "type": "prometheus", "uid": "prometheus" }, "query": { "query": "label_values(graphql_requests_total{service_name=~\"$service\"}, root_field)", "refId": "PrometheusVariableQueryEditor-VariableQuery" }, "definition": "label_values(graphql_requests_total{service_name=~\"$service\"}, root_field)", "refresh": 2, "sort": 1, "multi": true, "includeAll": true, "allValue": ".*", "current": { "selected": true, "text": ["All"], "value": ["$__all"] } },
          { "name": "error_code", "label": "Error code", "type": "query", "datasource": { "type": "prometheus", "uid": "prometheus" }, "query": { "query": "label_values(graphql_errors_total{service_name=~\"$service\"}, error_code)", "refId": "PrometheusVariableQueryEditor-VariableQuery" }, "definition": "label_values(graphql_errors_total{service_name=~\"$service\"}, error_code)", "refresh": 2, "sort": 1, "multi": true, "includeAll": true, "allValue": ".*", "current": { "selected": true, "text": ["All"], "value": ["$__all"] } }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Error Ratio",
          "description": "Errors / requests for the selected codes. Client-caused codes (NOT_FOUND, CONFLICT, BAD_USER_INPUT, validation, parse) count too; watch 'Server Errors/s' for genuine faults.",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 }] } } },
          "targets": [
            { "expr": "(sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[5m])) or vector(0)) / sum(rate(graphql_requests_total{service_name=~\"$service\",root_field=~\"$root_field\"}[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Errors/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[5m])) or vector(0)", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Server Errors/s",
          "description": "INTERNAL_SERVER_ERROR / UNKNOWN: unhandled resolver exceptions, i.e. bugs or dependency failures rather than bad requests. Should stay at 0.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.001 }] } } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"INTERNAL_SERVER_ERROR|UNKNOWN\"}[5m])) or vector(0)", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Conflicts/s",
          "description": "CONFLICT: optimistic-lock version mismatches (updateMessage) and deleteAuthor/attachLabel constraint conflicts. Expected under concurrent writes (see k6-transaction-isolation.js).",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=\"CONFLICT\"}[5m])) or vector(0)", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Errors by Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "noValue": "No errors", "custom": { "fillOpacity": 30, "stacking": { "mode": "normal" } } } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[5m])) by (error_code)", "legendFormat": "{{error_code}}", "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Error Ratio by Root Field",
          "description": "Only root fields that have errored appear.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "noValue": "No errors" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[5m])) by (service_name, root_field) / sum(rate(graphql_requests_total{service_name=~\"$service\",root_field=~\"$root_field\"}[5m])) by (service_name, root_field)", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 7,
          "title": "Errors by Root Field and Code",
          "description": "Errors are attributed to the root field named in the error's path; errors with no path (e.g. variable coercion failures) count against every root field of the operation.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "noValue": "No errors" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[5m])) by (service_name, root_field, error_code)", "legendFormat": "{{service_name}} / {{root_field}} / {{error_code}}", "refId": "A" }
          ]
        },
        {
          "id": 8,
          "title": "Conflict Ratio by Root Field",
          "description": "Share of each root field's requests that ended in a CONFLICT.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "noValue": "No errors" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=\"CONFLICT\"}[5m])) by (service_name, root_field) / sum(rate(graphql_requests_total{service_name=~\"$service\",root_field=~\"$root_field\"}[5m])) by (service_name, root_field)", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "Client Input Errors (bad input, validation, parse)",
          "description": "Requests rejected before or during execution because of what the client sent. Validation and parse failures appear under root_field 'unresolved'.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "noValue": "No errors" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"BAD_USER_INPUT|GRAPHQL_VALIDATION_FAILED|GRAPHQL_PARSE_FAILED\"}[5m])) by (service_name, error_code)", "legendFormat": "{{service_name}} / {{error_code}}", "refId": "A" }
          ]
        },
        {
          "id": 10,
          "title": "NOT_FOUND by Root Field",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops", "noValue": "No errors" } },
          "targets": [
            { "expr": "sum(rate(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=\"NOT_FOUND\"}[5m])) by (service_name, root_field)", "legendFormat": "{{service_name}} / {{root_field}}", "refId": "A" }
          ]
        },
        {
          "id": 11,
          "title": "Error Totals (current window)",
          "description": "Error counts per (service, root field, code) over the selected time range.",
          "type": "table",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "overrides": [{ "matcher": { "id": "byName", "options": "errors" }, "properties": [{ "id": "decimals", "value": 0 }] }] },
          "transformations": [{ "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "Value": "errors", "service_name": "service", "root_field": "root field", "error_code": "code" } } }, { "id": "sortBy", "options": { "fields": {}, "sort": [{ "field": "errors", "desc": true }] } }],
          "targets": [
            { "expr": "sum(increase(graphql_errors_total{service_name=~\"$service\",root_field=~\"$root_field\",error_code=~\"$error_code\"}[$__range])) by (service_name, root_field, error_code)", "format": "table", "instant": true, "refId": "A" }
          ]
        }
      ]
    }
