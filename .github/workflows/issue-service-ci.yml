name: issue-service CI

on:
  push:
    branches: [main]
    paths:
      - "issue-service/**"
      - ".github/workflows/issue-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "issue-service/**"
      - ".github/workflows/issue-service-ci.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: issue-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck)
        run: npm run build

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # <UTC yyyymmddHHMMSS>-<7-char sha>: sorts lexically by build time (Argo CD Image Updater's
      # "alphabetical" strategy picks the highest tag) while still identifying the commit.
      - name: Compute image tag
        if: github.event_name != 'pull_request'
        id: meta
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: issue-service
          file: issue-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/miqui/issue-service:${{ steps.meta.outputs.tag }}
            docker.io/miqui/issue-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
