name: message-service CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/message-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/message-service-ci.yml"
  workflow_dispatch: {}

# Image: us-central1-docker.pkg.dev/<project>/graphql-apollo-prisma-o2/message-service (Artifact Registry).
# Pushing authenticates keylessly: GitHub's OIDC token is exchanged through Workload Identity
# Federation for a short-lived token of the ci-graphql-apollo-prisma-o2 service account, which can
# only write to that one repository. The federation provider only accepts tokens from main, so
# pull requests (which never push) can't obtain it either. Set up by gke-deploy.sh, which prints
# the two repository variables below.
env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/k8s-dev-412419/graphql-apollo-prisma-o2/message-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck)
        run: npm run build

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      # <UTC yyyymmddHHMMSS>-<7-char sha>: sorts lexically by build time (Argo CD Image Updater's
      # "alphabetical" strategy picks the highest tag) while still identifying the commit.
      - name: Compute image tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: meta
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # amd64 only: GKE's e2 nodes are x86_64.
      - name: Build and push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=message-service
          cache-to: type=gha,mode=max,scope=message-service
